<!doctype html>
<html lang="ar" dir="rtl">


<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080808">

  <title>تلمذة</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Apple / iPhone Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="تلمذة">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <!-- Website Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="talmaza-v2.css">
</head>

<body>
    <div id="toast" role="status"></div>
    <section id="login" class="auth">
        <div class="auth-card glass">
            <div class="mark">✦</div>
            <p class="eyebrow">رحلتك كل يوم</p>
            <h1>تلمذة<span>.</span></h1>
            <p class="muted">كل خطوة صغيرة بتفرق.</p>
            <form id="loginForm"><label>اسم المستخدم<input id="username" autocomplete="username" required
                        placeholder="اكتب اسم المستخدم"></label><label>كلمة السر<span class="password-wrap"><input
                            id="password" type="password" autocomplete="current-password" required
                            placeholder="اكتب كلمة السر"><button type="button" class="eye-toggle"
                            data-toggle-password="password"
                            aria-label="إظهار كلمة السر">◉</button></span></label><button class="primary"
                    type="submit">دخول <span>←</span></button></form>
            <p id="loginError" class="error" aria-live="polite"></p>
        </div>
    </section>
    <div id="shell" class="hidden">
        <header class="topbar">
            <div><span class="eyebrow" id="roleLabel"></span>
                <h2 id="greeting">أهلاً بيك</h2>
            </div><button class="icon-btn" id="logout" title="خروج" aria-label="تسجيل خروج">↪</button>
        </header>
        <main id="view" class="view"></main>
        <nav id="nav" class="bottom-nav" aria-label="التنقل"></nav>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
